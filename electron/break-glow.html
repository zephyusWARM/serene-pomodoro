<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serene Guardian - 休息光暈</title>
    <style>
        @font-face {
          font-family: 'Inter';
          font-style: normal;
          font-weight: 100 900;
          font-display: swap;
          src: url('fonts/InterVariable-latin.woff2') format('woff2');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            pointer-events: none !important;
            user-select: none !important;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent !important;
            font-family: 'Inter', 'Microsoft JhengHei UI', 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', system-ui, -apple-system, sans-serif;
        }

        /* ── Screen Perimeter Vignette Gradient Glow ──
           The breathing inset glow is drawn as its two keyframe states, each painted once as a
           static layer, and blended by animating only their opacity (see the script below). The
           compositor does that without repainting; animating the huge inset box-shadow itself
           repainted the entire screen on every frame. */
        .glow-vignette {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        .glow-vignette-low,
        .glow-vignette-high {
            position: absolute;
            inset: 0;
            will-change: opacity;
        }
        .glow-vignette-low {
            box-shadow: 
                inset 0 0 65px 20px rgba(52, 211, 153, 0.38),
                inset 0 0 120px 48px rgba(16, 185, 129, 0.22),
                inset 0 0 200px 80px rgba(5, 150, 105, 0.12);
            opacity: 0.82;
        }
        .glow-vignette-high {
            box-shadow: 
                inset 0 0 95px 35px rgba(52, 211, 153, 0.55),
                inset 0 0 160px 70px rgba(16, 185, 129, 0.35),
                inset 0 0 260px 110px rgba(5, 150, 105, 0.22);
            opacity: 0;
        }

        /* Edge-specific linear gradient sweeps for ultra-rich depth */
        .edge-top {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 110px;
            background: linear-gradient(to bottom, rgba(52, 211, 153, 0.42) 0%, rgba(16, 185, 129, 0.18) 45%, transparent 100%);
            z-index: 2;
            animation: breatheEdge 4.5s ease-in-out infinite alternate;
        }

        .edge-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 110px;
            background: linear-gradient(to top, rgba(52, 211, 153, 0.42) 0%, rgba(16, 185, 129, 0.18) 45%, transparent 100%);
            z-index: 2;
            animation: breatheEdge 4.5s ease-in-out infinite alternate;
        }

        .edge-left {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            width: 90px;
            background: linear-gradient(to right, rgba(52, 211, 153, 0.38) 0%, rgba(16, 185, 129, 0.15) 50%, transparent 100%);
            z-index: 2;
            animation: breatheEdge 4.5s ease-in-out infinite alternate;
        }

        .edge-right {
            position: fixed;
            top: 0;
            bottom: 0;
            right: 0;
            width: 90px;
            background: linear-gradient(to left, rgba(52, 211, 153, 0.38) 0%, rgba(16, 185, 129, 0.15) 50%, transparent 100%);
            z-index: 2;
            animation: breatheEdge 4.5s ease-in-out infinite alternate;
        }

        /* Ambient corner highlights */
        .corner-glow {
            position: fixed;
            width: 260px;
            height: 260px;
            opacity: 0.55;
            z-index: 2;
            animation: breatheCorner 6s ease-in-out infinite alternate;
        }
        /* The blur lives on an inner element so it is painted once into the animated layer instead
           of being re-applied by the compositor on every frame (same result: blur, then scale). */
        .corner-glow::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            filter: blur(50px);
            background: var(--corner-fill);
        }
        .corner-tl { top: -80px; left: -80px; --corner-fill: radial-gradient(circle, rgba(52, 211, 153, 0.6) 0%, transparent 70%); }
        .corner-tr { top: -80px; right: -80px; --corner-fill: radial-gradient(circle, rgba(45, 212, 191, 0.6) 0%, transparent 70%); }
        .corner-bl { bottom: -80px; left: -80px; --corner-fill: radial-gradient(circle, rgba(45, 212, 191, 0.6) 0%, transparent 70%); }
        .corner-br { bottom: -80px; right: -80px; --corner-fill: radial-gradient(circle, rgba(52, 211, 153, 0.6) 0%, transparent 70%); }

        @keyframes breatheEdge {
            0%   { opacity: 0.75; transform: scale(0.995); }
            100% { opacity: 1;    transform: scale(1.005); }
        }

        @keyframes breatheCorner {
            0%   { opacity: 0.42; transform: scale(0.9); }
            100% { opacity: 0.7;  transform: scale(1.15); }
        }

        /* ── Particle Field (Edge Fireflies / Floating Motes) ──
           Each mote is a small element moved by a compositor animation, so the field costs no
           per-frame script or full-screen canvas redraw. Look and motion match the former canvas. */
        #particleField {
            position: fixed;
            inset: 0;
            z-index: 3;
            overflow: hidden;
        }

        .mote {
            position: absolute;
            border-radius: 50%;
            box-shadow: 0 0 8px #34d399;
            opacity: 0;
            will-change: transform, opacity;
        }

        /* ── Minimalist Top Status Pill ── */
        .status-container {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pillFadeIn 1s ease-out forwards;
        }

        @keyframes pillFadeIn {
            0%   { opacity: 0; transform: translate(-50%, -10px); }
            100% { opacity: 1; transform: translate(-50%, 0); }
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 7px 20px;
            background: rgba(8, 20, 16, 0.65);
            border: 1px solid rgba(52, 211, 153, 0.35);
            border-radius: 9999px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 
                0 10px 25px rgba(0, 0, 0, 0.35),
                0 0 20px rgba(52, 211, 153, 0.2);
            color: rgba(255, 255, 255, 0.92);
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 10px #34d399;
            animation: pulseDot 2s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50%      { transform: scale(1.35); opacity: 1; }
        }

        .time-badge {
            font-variant-numeric: tabular-nums;
            font-weight: 500;
            color: #6ee7b7;
            letter-spacing: 0.05em;
        }

        .status-hint {
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.78rem;
            margin-left: 2px;
        }
    </style>
</head>
<body>
    <div class="glow-vignette">
        <div class="glow-vignette-low"></div>
        <div class="glow-vignette-high"></div>
    </div>
    <div class="edge-top"></div>
    <div class="edge-bottom"></div>
    <div class="edge-left"></div>
    <div class="edge-right"></div>

    <div class="corner-glow corner-tl"></div>
    <div class="corner-glow corner-tr"></div>
    <div class="corner-glow corner-bl"></div>
    <div class="corner-glow corner-br"></div>

    <div id="particleField"></div>

    <div class="status-container">
        <div class="status-pill">
            <span class="status-dot"></span>
            <span>🌿 靜謐休息中</span>
            <span class="time-badge" id="timeText">05:00</span>
            <span class="status-hint">· 放鬆雙眼與肩頸</span>
        </div>
    </div>

    <script>
        const timeEl = document.getElementById('timeText');

        // Listen for timer updates from Electron main process
        if (window.glowAPI?.onTick) {
            window.glowAPI.onTick((data) => {
                if (data && data.timeText) {
                    timeEl.textContent = data.timeText;
                }
            });
        }

        // Vignette breathing: the original animated the inset box-shadow (blur, spread, alpha) and
        // opacity 0.82 -> 1 over 4.5 s, ease-in-out, alternating. These opacity curves blend the two
        // static end states so every intermediate frame matches that interpolation (least-squares
        // fit against rendered frames at each 10% of progress; both end states are exact).
        const VIGNETTE_LOW  = [0.82, 0.857, 0.876, 0.872, 0.869, 0.865, 0.847, 0.808, 0.719, 0.559, 0];
        const VIGNETTE_HIGH = [0,    0.03,  0.09,  0.16,  0.23,  0.31,  0.40,  0.49,  0.62,  0.76,  1];
        const breathe = { duration: 4500, easing: 'ease-in-out', iterations: Infinity, direction: 'alternate' };
        const toFrames = (values) => values.map((opacity, i) => ({ opacity, offset: i / (values.length - 1) }));
        document.querySelector('.glow-vignette-low').animate(toFrames(VIGNETTE_LOW), breathe);
        document.querySelector('.glow-vignette-high').animate(toFrames(VIGNETTE_HIGH), breathe);

        // Perimeter energy motes. Motion is the canvas version's per-frame velocities and lifetimes
        // expressed in time; fill, glow (shadowBlur 8 = box-shadow blur 8) and the 30-frame fade
        // in/out are unchanged. Everything per frame runs on the compositor.
        const field = document.getElementById('particleField');
        // The canvas version advanced once per rendered frame, so its speed followed the display's
        // refresh rate. Start at 60 Hz and switch to the measured frame interval once known.
        let frameMs = 1000 / 60;
        const FADE_FRAMES = 30;
        const MAX_ALPHA = 0.5;

        function spawn(mote, randomize) {
            const width = window.innerWidth;
            const height = window.innerHeight;
            let x, y, vx, vy;
            // Spawn near borders
            const side = Math.floor(Math.random() * 4);
            if (side === 0) { // Top
                x = Math.random() * width;
                y = randomize ? Math.random() * 120 : 0;
                vx = (Math.random() - 0.5) * 0.4;
                vy = Math.random() * 0.3 + 0.1;
            } else if (side === 1) { // Bottom
                x = Math.random() * width;
                y = randomize ? height - Math.random() * 120 : height;
                vx = (Math.random() - 0.5) * 0.4;
                vy = -(Math.random() * 0.3 + 0.1);
            } else if (side === 2) { // Left
                x = randomize ? Math.random() * 100 : 0;
                y = Math.random() * height;
                vx = Math.random() * 0.3 + 0.1;
                vy = (Math.random() - 0.5) * 0.4;
            } else { // Right
                x = randomize ? width - Math.random() * 100 : width;
                y = Math.random() * height;
                vx = -(Math.random() * 0.3 + 0.1);
                vy = (Math.random() - 0.5) * 0.4;
            }
            const size = Math.random() * 2.2 + 0.8;
            const maxLife = Math.random() * 180 + 120;
            const hue = Math.random() > 0.4 ? 158 : 172; // Emerald or Teal

            mote.style.width = `${size * 2}px`;
            mote.style.height = `${size * 2}px`;
            mote.style.left = `${x - size}px`;
            mote.style.top = `${y - size}px`;
            mote.style.background = `hsl(${hue}, 80%, 65%)`;

            const fade = FADE_FRAMES / maxLife;
            const animation = mote.animate([
                { transform: 'translate(0px, 0px)', opacity: 0, offset: 0 },
                { opacity: MAX_ALPHA, offset: fade },
                { opacity: MAX_ALPHA, offset: 1 - fade },
                { transform: `translate(${vx * maxLife}px, ${vy * maxLife}px)`, opacity: 0, offset: 1 },
            ], { duration: maxLife * frameMs, easing: 'linear' });
            animation.onfinish = () => spawn(mote, false);
        }

        const count = 35;
        for (let i = 0; i < count; i++) {
            const mote = document.createElement('div');
            mote.className = 'mote';
            field.appendChild(mote);
            spawn(mote, true);
        }

        // Measure the real frame interval and apply it to running motes. The first frames after the
        // window opens can be slow, so they are skipped; the median of the next 20 is snapped to a
        // standard refresh rate so a brief stall cannot slow the motes for the whole break.
        const REFRESH_RATES = [60, 75, 90, 100, 120, 144, 165, 240];
        const frameTimes = [];
        let skipFrames = 10;
        const sampleFrame = (now) => {
            if (skipFrames > 0) {
                skipFrames--;
                requestAnimationFrame(sampleFrame);
                return;
            }
            frameTimes.push(now);
            if (frameTimes.length < 21) {
                requestAnimationFrame(sampleFrame);
                return;
            }
            const deltas = frameTimes.slice(1).map((t, i) => t - frameTimes[i]).sort((a, b) => a - b);
            const hz = 1000 / deltas[Math.floor(deltas.length / 2)];
            const standard = REFRESH_RATES.find((rate) => Math.abs(rate - hz) / rate < 0.08);
            if (!standard) return; // unclear measurement: keep 60 Hz timing
            const measured = 1000 / standard;
            const rate = frameMs / measured;
            frameMs = measured;
            if (rate !== 1) {
                field.getAnimations({ subtree: true }).forEach((animation) => animation.updatePlaybackRate(rate));
            }
        };
        requestAnimationFrame(sampleFrame);
    </script>
</body>
</html>
