<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serene Guardian - 休息光暈</title>
    <style>
        @font-face {
          font-family: 'Nunito';
          font-style: normal;
          font-weight: 100 900;
          font-display: swap;
          src: url('fonts/NunitoVariable-latin.woff2') format('woff2');
        }

        :root {
            --ink: #f8efe3;
            --ink-2: #dccfbe;
            --accent-rgb: 142 201 163; /* short break green; a long break turns it indigo */
            --accent: rgb(var(--accent-rgb));
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        :root[data-mode="longBreak"] { --accent-rgb: 190 166 235; }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            pointer-events: none !important;
            user-select: none !important;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent !important;
            font-family: 'Nunito', 'Microsoft JhengHei UI', 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', system-ui, -apple-system, sans-serif;
            font-variant-numeric: tabular-nums;
            -webkit-font-smoothing: antialiased;
        }

        /* ── The edge of the screen, lit softly ──
           The breathing inset glow is two static layers (the low and high state), each painted once,
           blended by animating only their opacity (see the script below). The compositor does that
           without repainting; animating the huge inset box-shadow itself repainted the whole screen
           on every frame. Nothing else moves: no particles, no sweeps. */
        .glow-vignette {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        .glow-vignette-low,
        .glow-vignette-high {
            position: absolute;
            inset: 0;
            will-change: opacity;
        }
        .glow-vignette-low {
            box-shadow:
                inset 0 0 80px 22px rgb(var(--accent-rgb) / 0.30),
                inset 0 0 180px 60px rgb(var(--accent-rgb) / 0.14);
            opacity: 0.82;
        }
        .glow-vignette-high {
            box-shadow:
                inset 0 0 110px 34px rgb(var(--accent-rgb) / 0.44),
                inset 0 0 240px 90px rgb(var(--accent-rgb) / 0.22);
            opacity: 0;
        }

        /* ── Status pill ── */
        .status-container {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pillFadeIn 1s var(--ease) forwards;
        }

        @media (prefers-reduced-motion: reduce) {
            .status-container { animation: none; }
        }

        @keyframes pillFadeIn {
            0%   { opacity: 0; transform: translate(-50%, -10px); }
            100% { opacity: 1; transform: translate(-50%, 0); }
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 40px;
            padding: 8px 18px;
            background: rgb(40 30 25 / 0.88);
            border: 1px solid rgb(255 236 210 / 0.1);
            border-radius: 9999px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 28px rgb(20 9 3 / 0.35);
            color: var(--ink);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
        }

        .time-badge {
            font-weight: 600;
            color: var(--ink);
        }

        .status-hint {
            color: var(--ink-2);
            font-size: 0.8125rem;
            font-weight: 400;
        }
    </style>
</head>
<body>
    <div class="glow-vignette">
        <div class="glow-vignette-low"></div>
        <div class="glow-vignette-high"></div>
    </div>

    <div class="status-container">
        <div class="status-pill">
            <span class="status-dot"></span>
            <span>靜謐休息中</span>
            <span class="time-badge" id="timeText">05:00</span>
            <span class="status-hint">放鬆雙眼與肩頸</span>
        </div>
    </div>

    <script>
        const timeEl = document.getElementById('timeText');

        // Listen for timer updates from Electron main process
        if (window.glowAPI?.onTick) {
            window.glowAPI.onTick((data) => {
                if (data && data.timeText) {
                    timeEl.textContent = data.timeText;
                }
                if (data && data.mode) {
                    document.documentElement.dataset.mode = data.mode;
                }
            });
        }

        // Vignette breathing over 4.5 s, ease-in-out, alternating. These opacity curves blend the two
        // static end states so every intermediate frame matches the original box-shadow interpolation
        // (least-squares fit against rendered frames at each 10% of progress; both end states exact).
        const VIGNETTE_LOW  = [0.82, 0.857, 0.876, 0.872, 0.869, 0.865, 0.847, 0.808, 0.719, 0.559, 0];
        const VIGNETTE_HIGH = [0,    0.03,  0.09,  0.16,  0.23,  0.31,  0.40,  0.49,  0.62,  0.76,  1];
        const breathe = { duration: 4500, easing: 'ease-in-out', iterations: Infinity, direction: 'alternate' };
        const toFrames = (values) => values.map((opacity, i) => ({ opacity, offset: i / (values.length - 1) }));
        // With "reduce motion" on, hold the calm low state instead of breathing.
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.querySelector('.glow-vignette-low').animate(toFrames(VIGNETTE_LOW), breathe);
            document.querySelector('.glow-vignette-high').animate(toFrames(VIGNETTE_HIGH), breathe);
        }
    </script>
</body>
</html>
