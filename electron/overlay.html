<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serene Guardian - 時間到了</title>
    <style>
        @font-face {
          font-family: 'Nunito';
          font-style: normal;
          font-weight: 100 900;
          font-display: swap;
          src: url('fonts/NunitoVariable-latin.woff2') format('woff2');
        }

        :root {
            --surface: #18120f;
            --ink: #f8efe3;
            --ink-2: #dccfbe;
            --ink-3: #b8aa98;
            --on-ink: #2b1d14;
            --fill-1: rgb(255 236 210 / 0.07);
            --fill-2: rgb(255 236 210 / 0.12);
            --fill-3: rgb(255 236 210 / 0.18);
            --hairline: rgb(255 236 210 / 0.10);
            --accent-rgb: 255 171 100;                 /* focus ended: Apple orange */
            --accent: rgb(var(--accent-rgb));
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* The colour of the moment follows what just ended, and how often it was put off. */
        body.mode-shortBreak { --accent-rgb: 142 201 163; }
        body.mode-longBreak  { --accent-rgb: 190 166 235; }
        body.urgency-warning { --accent-rgb: 250 140 90; }
        body.urgency-critical { --accent-rgb: 236 112 98; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            /* Re-derived here so the mode/urgency overrides above reach every descendant. */
            --accent: rgb(var(--accent-rgb));
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Nunito', 'Microsoft JhengHei UI', 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif;
            font-variant-numeric: tabular-nums;
            -webkit-font-smoothing: antialiased;
            cursor: default;
            user-select: none;
            background: var(--surface);
            color: var(--ink);
        }

        button { font-family: inherit; }

        button:focus-visible {
            outline: 2px solid var(--ink);
            outline-offset: 3px;
        }

        /* ── Colour field of light ──
           Two static radial washes, nothing blurred and nothing drifting: the screen stays calm and
           costs nothing to paint. The "rest" wash (cool green) fades in over the first once the
           rest begins, by opacity only. */
        .ambient-bg,
        .ambient-rest {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            transition: opacity 1.6s ease;
        }
        .ambient-bg {
            background:
                radial-gradient(60vmax 60vmax at 50% 46%, rgb(var(--accent-rgb) / 0.30), transparent 62%),
                radial-gradient(90vmax 90vmax at 12% 108%, rgb(var(--accent-rgb) / 0.12), transparent 60%);
            animation: washIn 1.8s ease both;
        }
        .ambient-rest {
            background:
                radial-gradient(60vmax 60vmax at 50% 46%, rgb(142 201 163 / 0.26), transparent 62%),
                radial-gradient(90vmax 90vmax at 12% 108%, rgb(190 166 235 / 0.12), transparent 60%);
            opacity: 0;
        }
        body.phase-rest .ambient-bg { opacity: 0; animation: none; }
        body.phase-rest .ambient-rest { opacity: 1; }

        @keyframes washIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* ── Stage ── */
        .stage {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: min(560px, 100vw - 64px);
        }

        /* ── The light that breathes ── */
        .breathing-ring {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }

        .ring-svg {
            position: absolute;
            inset: 0;
            transform: rotate(-90deg);
            overflow: visible;
        }

        .ring-track { fill: none; stroke: var(--fill-2); stroke-width: 1.5; }
        .ring-line {
            fill: none;
            stroke: var(--accent);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-dasharray: 471;
            stroke-dashoffset: 471;
            transition: stroke-dashoffset 4s ease-in-out, stroke 1.6s ease;
        }
        /* A wider, fainter pass under the line stands in for the old blurred glow. */
        .ring-glow {
            fill: none;
            stroke: var(--accent);
            stroke-width: 9;
            stroke-linecap: round;
            stroke-dasharray: 471;
            stroke-dashoffset: 471;
            opacity: 0.18;
            transition: stroke-dashoffset 4s ease-in-out, stroke 1.6s ease;
        }

        .circle-inner {
            width: 132px;
            height: 132px;
            border-radius: 50%;
            background: radial-gradient(circle, rgb(var(--accent-rgb) / 0.55) 0%, rgb(var(--accent-rgb) / 0.18) 46%, rgb(var(--accent-rgb) / 0) 72%);
            transition: transform 4s ease-in-out, opacity 4s ease-in-out;
            will-change: transform, opacity;
        }

        /* While waiting for the choice, the light breathes gently on its own. */
        .mode-focus .circle-inner { animation: breathe 4s ease-in-out infinite; }
        @keyframes breathe {
            0%, 100% { transform: scale(0.95); opacity: 0.75; }
            50%      { transform: scale(1.12); opacity: 1; }
        }

        /* After the 3-second choice, the 4-7-8 breath takes over (JS drives it inline). */
        body.phase-rest .mode-focus .circle-inner { animation: none; }

        /* ── Text ── */
        .message {
            color: var(--ink);
            font-size: clamp(1.75rem, 3.4vw, 2.5rem);
            font-weight: 400;
            letter-spacing: 0.04em;
            line-height: 1.2;
            text-align: center;
            animation: fadeUp 1s var(--ease) both;
        }

        .sub-message {
            color: var(--ink-2);
            font-size: 1.0625rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            text-align: center;
            min-height: 1.6em;
            margin-top: 12px;
            animation: fadeUp 1.2s var(--ease) both;
            transition: opacity 0.45s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Focus end: rest or wait ── */
        .focus-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 36px;
            animation: fadeUp 1.4s var(--ease) both;
        }

        .focus-btn {
            position: relative;
            border: none;
            cursor: pointer;
            min-width: 240px;
            height: 52px;
            padding: 0 36px;
            border-radius: 9999px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            transition: transform 0.35s var(--ease), background-color 0.25s ease, color 0.25s ease;
        }
        .focus-btn:active { transform: scale(0.97); }

        .focus-btn.rest-btn {
            background: var(--ink);
            color: var(--on-ink);
        }
        .focus-btn.rest-btn:hover { background: #fffaf1; transform: translateY(-1px); }

        .focus-btn.wait-btn {
            height: 44px;
            background: transparent;
            color: var(--ink-2);
            font-weight: 500;
        }
        .focus-btn.wait-btn:hover { background: var(--fill-1); color: var(--ink); }

        /* ── Rest takeover: one gentle instruction ── */
        .stretch-tip {
            color: var(--ink);
            font-size: 1.125rem;
            font-weight: 400;
            letter-spacing: 0.03em;
            line-height: 1.7;
            text-align: center;
            max-width: 22em;
            margin-top: 20px;
            text-wrap: pretty;
            animation: fadeUp 1.2s var(--ease) both;
        }

        /* ── Manual way out (appears after 3 s; hidden from keyboard until then) ── */
        .dismiss-btn {
            position: fixed;
            left: 50%;
            bottom: 7vh;
            z-index: 20;
            transform: translateX(-50%);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0s linear 0.5s, background-color 0.25s ease;
            height: 48px;
            padding: 0 40px;
            border: 1px solid var(--hairline);
            border-radius: 9999px;
            background: var(--fill-2);
            color: var(--ink);
            font-size: 0.9375rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            cursor: pointer;
        }
        .dismiss-btn.visible {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.5s ease, visibility 0s, background-color 0.25s ease;
        }
        .dismiss-btn:hover { background: var(--fill-3); }
        .dismiss-btn:active { transform: translateX(-50%) scale(0.97); }

        @media (prefers-reduced-motion: reduce) {
            .ambient-bg, .message, .sub-message, .focus-actions, .stretch-tip { animation: none; }
            .mode-focus .circle-inner { animation: none; }
        }
    </style>
</head>
<body>
    <div class="ambient-bg" id="ambientBg"></div>
    <div class="ambient-rest" id="ambientRest"></div>

    <main class="stage" id="content">
        <div class="breathing-ring" aria-hidden="true">
            <svg class="ring-svg" width="200" height="200" viewBox="0 0 180 180">
                <circle class="ring-track" cx="90" cy="90" r="75"/>
                <circle class="ring-glow"  cx="90" cy="90" r="75" id="ringGlow"/>
                <circle class="ring-line"  cx="90" cy="90" r="75" id="ringLine"/>
            </svg>
            <div class="circle-inner" id="circleInner"></div>
        </div>

        <h1 class="message" id="message" aria-live="polite">時間到了</h1>
        <div class="sub-message" id="sub-message">深呼吸，放鬆一下</div>

        <div class="focus-actions" id="focusActions" style="display: none;">
            <button class="focus-btn rest-btn" id="restBtn" type="button">開始休息</button>
            <button class="focus-btn wait-btn" id="waitBtn" type="button">再等一分鐘</button>
        </div>

        <div class="stretch-tip" id="stretchTip" style="display: none;"></div>
    </main>

    <button class="dismiss-btn" id="dismissBtn" type="button" onclick="dismissOverlay()">繼續</button>

    <script>
        const params = new URLSearchParams(window.location.search);
        const mode = params.get('mode') || 'focus';
        const skipCount = parseInt(params.get('skipCount') || '0', 10);
        document.body.classList.add(`mode-${mode}`);
        document.getElementById('content').classList.add(`mode-${mode}`);

        // Apply urgency classes based on skip count
        if (skipCount >= 3) {
            document.body.classList.add('urgency-critical');
        } else if (skipCount >= 1) {
            document.body.classList.add('urgency-warning');
        }

        // ── Stretch & Health Tips ──
        const stretchTips = [
            '站起來，伸展你的雙腿',
            '慢慢轉動你的脖子，釋放肩頸壓力',
            '喝一口水吧，保持身體水分',
            '閉上眼睛 10 秒，讓它們休息',
            '雙手高舉過頭，向上伸展',
            '深呼吸三次，感受空氣進入身體',
            '走到窗邊，看看遠方的風景',
            '站起來活動一下脊椎，扭轉身體',
            '踮起腳尖再放下，重複 5 次',
            '閉眼，感受自己的呼吸 10 秒',
            '聳肩到耳朵旁，維持 3 秒再放鬆',
            '在房間走一小圈，讓血液流動',
        ];

        // Urgency messages based on skip count
        const urgencyMessages = {
            0: { msg: '專注結束', sub: '做得好，你值得休息一下' },
            1: { msg: '該休息囉', sub: '你已經延後一次了，身體正輕輕提醒你' },
            2: { msg: '先休息一下吧', sub: '坐了好一陣子，站起來伸展一下' },
            3: { msg: '好好休息一下', sub: '你已經很努力了，現在輪到身體' },
        };

        /* ── Timers & Logic ── */
        const msgEl  = document.getElementById('message');
        const subEl  = document.getElementById('sub-message');
        const glow   = document.getElementById('ringGlow');
        const line   = document.getElementById('ringLine');
        const inner  = document.getElementById('circleInner');

        const CIRC = 471; // 2 * PI * 75

        function setRingProgress(pct) {
            const offset = CIRC - CIRC * pct;
            glow.style.strokeDashoffset = offset;
            line.style.strokeDashoffset = offset;
        }

        // The rest has begun: the colour of the room turns cool and green, by opacity and stroke only.
        function enterRestPhase() {
            document.body.classList.add('phase-rest');
            line.style.stroke = 'rgb(142 201 163)';
            glow.style.stroke = 'rgb(142 201 163)';
        }

        function startBreatheCycle(durationMs = 19000, initialDelay = false) {
            const breathe = () => {
                subEl.style.opacity = '0';
                setTimeout(() => { subEl.textContent = '吸氣'; subEl.style.opacity = '1'; }, 200);
                glow.style.transition = `stroke-dashoffset 4s ease-in-out`;
                line.style.transition = `stroke-dashoffset 4s ease-in-out`;
                inner.style.transition = 'transform 4s ease-in-out, opacity 4s ease';
                setRingProgress(1);
                inner.style.transform = 'scale(1.25)';
                inner.style.opacity = '1';

                setTimeout(() => {
                    subEl.style.opacity = '0';
                    setTimeout(() => { subEl.textContent = '閉氣'; subEl.style.opacity = '1'; }, 200);
                    glow.style.transition = 'none'; line.style.transition = 'none';
                    inner.style.transition = 'opacity 7s ease';
                    inner.style.opacity = '0.7';
                }, 4000);

                setTimeout(() => {
                    subEl.style.opacity = '0';
                    setTimeout(() => { subEl.textContent = '緩緩吐氣'; subEl.style.opacity = '1'; }, 200);
                    glow.style.transition = `stroke-dashoffset 8s ease-in-out`;
                    line.style.transition = `stroke-dashoffset 8s ease-in-out`;
                    inner.style.transition = 'transform 8s ease-in-out, opacity 8s ease';
                    setRingProgress(0.05);
                    inner.style.transform = 'scale(1)';
                    inner.style.opacity = '0.3';
                }, 11000);
            };

            if (initialDelay) {
                setTimeout(breathe, 100);
            } else {
                breathe();
            }
            return setInterval(breathe, durationMs);
        }

        if (mode === 'focus') {
            // Get urgency level message
            const urgency = urgencyMessages[Math.min(skipCount, 3)];
            msgEl.textContent = urgency.msg;
            subEl.textContent = urgency.sub;
            setRingProgress(1);
            glow.style.transition = 'none';
            line.style.transition = 'none';

            const focusActions = document.getElementById('focusActions');
            const restBtn = document.getElementById('restBtn');
            const waitBtn = document.getElementById('waitBtn');
            focusActions.style.display = 'flex';

            // Hide wait button if skip count >= 3 (forced rest)
            if (skipCount >= 3) {
                waitBtn.style.display = 'none';
            }

            let countdown = 3;
            restBtn.textContent = `開始休息 · ${countdown} 秒`;

            const startRestTakeover = () => {
                focusActions.style.display = 'none';
                msgEl.textContent = '休息一下';

                // Record wall-clock start time for sleep-proof guard
                const restStartTime = Date.now();
                const REST_DURATION_MS = 10000; // 10 seconds
                const REST_GRACE_MS = 2000; // 2 second grace period

                // Show random stretch tip
                const stretchTip = document.getElementById('stretchTip');
                const tip = stretchTips[Math.floor(Math.random() * stretchTips.length)];
                stretchTip.textContent = tip;
                stretchTip.style.display = 'block';
                subEl.textContent = '';

                // After 3 seconds, start breathing cycle AND show backup dismiss button
                setTimeout(() => {
                    stretchTip.style.display = 'none';
                    enterRestPhase();
                    startBreatheCycle(19000, true);

                    // Show backup dismiss button so user always has a manual escape
                    document.getElementById('dismissBtn').classList.add('visible');
                }, 3000);

                // Primary auto-close timer
                setTimeout(() => {
                    if (window.overlayAPI?.sendAction) window.overlayAPI.sendAction('rest-complete');
                    dismissOverlay();
                }, REST_DURATION_MS);

                // Wall-clock guard: check real elapsed time every second
                // This catches cases where setTimeout was frozen during sleep
                const wallClockGuard = setInterval(() => {
                    const elapsed = Date.now() - restStartTime;
                    if (elapsed >= REST_DURATION_MS + REST_GRACE_MS) {
                        clearInterval(wallClockGuard);
                        if (window.overlayAPI?.sendAction) window.overlayAPI.sendAction('rest-complete');
                        dismissOverlay();
                    }
                }, 1000);

                // visibilitychange guard: when page becomes visible after sleep,
                // immediately check if we've exceeded the rest duration
                const onVisibilityChange = () => {
                    if (document.visibilityState === 'visible') {
                        const elapsed = Date.now() - restStartTime;
                        if (elapsed >= REST_DURATION_MS) {
                            clearInterval(wallClockGuard);
                            document.removeEventListener('visibilitychange', onVisibilityChange);
                            if (window.overlayAPI?.sendAction) window.overlayAPI.sendAction('rest-complete');
                            dismissOverlay();
                        }
                    }
                };
                document.addEventListener('visibilitychange', onVisibilityChange);
            };

            const focusInterval = setInterval(() => {
                countdown--;
                if (countdown <= 0) {
                    clearInterval(focusInterval);
                    startRestTakeover();
                } else {
                    restBtn.textContent = `開始休息 · ${countdown} 秒`;
                }
            }, 1000);

            restBtn.onclick = () => {
                clearInterval(focusInterval);
                startRestTakeover();
            };

            waitBtn.onclick = () => {
                clearInterval(focusInterval);
                if (window.overlayAPI?.sendAction) window.overlayAPI.sendAction('wait-one-minute');
                dismissOverlay();
            };

        } else {
            msgEl.textContent = mode === 'shortBreak' ? '短休息結束' : '長休息結束';
            subEl.textContent = '準備好了就繼續';

            startBreatheCycle();

            const breakOverlayStart = Date.now();
            setTimeout(() => {
                document.getElementById('dismissBtn').classList.add('visible');
            }, 3000);

            // visibilitychange guard for break overlays too:
            // if the user sleeps and wakes up, immediately show the dismiss button
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    const elapsed = Date.now() - breakOverlayStart;
                    if (elapsed >= 3000) {
                        document.getElementById('dismissBtn').classList.add('visible');
                    }
                }
            });
        }

        function dismissOverlay() {
            if (window.overlayAPI?.closeOverlay) window.overlayAPI.closeOverlay();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const btn = document.getElementById('dismissBtn');
                if (btn.classList.contains('visible')) dismissOverlay();
            }
        });
    </script>
</body>
</html>
